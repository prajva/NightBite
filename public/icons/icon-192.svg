<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2"/>

  <!-- Glowing Moon Silhouette -->
  <path d="M120 44 C110 44 98 48 90 56 C76 70 76 94 90 108 C102 120 120 122 134 114 C128 128 114 138 96 138 C72 138 52 118 52 94 C52 72 68 54 88 50 C98 48 108 48 120 44 Z" 
        fill="url(#amberGlow)" filter="url(#neon)" opacity="0.95"/>

  <!-- Roll / Food Bite Silhouette -->
  <g transform="translate(68, 76)">
    <!-- Hot Roll Bun -->
    <path d="M 0 24 C 0 10, 14 0, 32 0 C 44 0, 56 6, 60 16 C 54 18, 50 24, 52 30 C 53 34, 58 36, 62 36 C 61 46, 48 54, 32 54 C 14 54, 0 44, 0 28 Z" fill="#18181B" stroke="#F59E0B" stroke-width="3.5"/>
    <!-- Sesame / Spices dots -->
    <circle cx="20" cy="18" r="2.5" fill="#F59E0B" />
    <circle cx="34" cy="14" r="2.5" fill="#F59E0B" />
    <circle cx="44" cy="24" r="2" fill="#F59E0B" />
    <circle cx="26" cy="32" r="2" fill="#10B981" />
    <circle cx="38" cy="36" r="2" fill="#EF4444" />
  </g>

  <!-- Midnight Star Sparkle -->
  <path d="M142 42 Q144 49 151 51 Q144 53 142 60 Q140 53 133 51 Q140 49 142 42 Z" fill="#F59E0B"/>
</svg>
